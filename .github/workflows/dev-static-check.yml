name: Dev Static Checks

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-static-${{ github.ref }}
  cancel-in-progress: true

env:
  TINA_TOOLCHAIN_RELEASE_REPO: 'wuxianggujun/TinaIDE'
  TINA_TOOLCHAIN_RELEASE_TAG: 'toolchain-v0.2.4'
  TS_CLI_BUILD_FROM_SOURCE: 'false'
  GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC"

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: false
          submodules: recursive
          fetch-depth: 1

      - name: Run maintenance checks
        run: python3 tools/checks/check_all.py

      - name: Run i18n checks
        run: python3 tools/i18n/check_all.py

      - name: Test plugin device gate result parser
        shell: pwsh
        run: ./tools/testing/plugin-device-gate-result.tests.ps1

      - name: Restore tina-toolchain assets
        run: bash tools/ci/restore-tina-toolchain-assets.sh arm64

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install CMake
        run: sdkmanager --install "cmake;3.22.1"

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.22.1

      - name: Setup tree-sitter grammar dependencies
        run: |
          cd external/tina-android-tree-sitter/grammars/cpp
          mkdir -p node_modules
          ln -sf ../../c node_modules/tree-sitter-c

          cd ../toml
          npm install --ignore-scripts regexp-util

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run plugin, help, and tutorial JVM tests
        run: |
          ./gradlew -Ptina.devAbi=arm64 -Ptina.buildProotFromSource=false \
            :core:plugin:testDebugUnitTest :feature:help:testDebugUnitTest :feature:tutorial:testDebugUnitTest \
            --no-daemon --configure-on-demand \
            -Dorg.gradle.internal.http.connectionTimeout=120000 \
            -Dorg.gradle.internal.http.socketTimeout=120000 \
            -Dorg.gradle.internal.repository.max.retries=4

      - name: Run app tutorial article JVM tests and compile app Kotlin
        run: |
          ./gradlew -Ptina.devAbi=arm64 -Ptina.buildProotFromSource=false \
            :app:testArm64DebugUnitTest \
            --tests "com.wuxianggujun.tinaide.ui.compose.screens.main.tutorial.TutorialArticleLoadStateTest" \
            --tests "com.wuxianggujun.tinaide.ui.compose.screens.main.tutorial.TutorialRelatedLearningSupportTest" \
            --no-daemon --configure-on-demand \
            -Dorg.gradle.internal.http.connectionTimeout=120000 \
            -Dorg.gradle.internal.http.socketTimeout=120000 \
            -Dorg.gradle.internal.repository.max.retries=4

      - name: Upload plugin and tutorial JVM failure reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jvm-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            core/plugin/build/test-results/testDebugUnitTest/
            core/plugin/build/reports/tests/testDebugUnitTest/
            feature/help/build/test-results/testDebugUnitTest/
            feature/help/build/reports/tests/testDebugUnitTest/
            feature/tutorial/build/test-results/testDebugUnitTest/
            feature/tutorial/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testArm64DebugUnitTest/
            app/build/reports/tests/testArm64DebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup Gradle processes
        if: ${{ always() }}
        run: |
          set +e
          ./gradlew --stop || true
          pgrep -af 'GradleDaemon|org.gradle.launcher.daemon' || true
